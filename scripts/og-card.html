<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Plex Cond';font-weight:700;src:url('/fonts/IBMPlexSansCondensed-Bold.woff2') format('woff2');}
  @font-face{font-family:'Plex Sans';font-weight:400;src:url('/fonts/IBMPlexSans-Variable.woff2') format('woff2');}
  @font-face{font-family:'Plex Mono';font-weight:500;src:url('/fonts/IBMPlexMono-Medium.woff2') format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;background:#0B0D12;overflow:hidden;}
  body{
    position:relative;
    font-family:'Plex Sans',sans-serif;
    background-image:
      linear-gradient(rgba(124,147,168,.14) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,147,168,.14) 1px, transparent 1px);
    background-size:56px 56px;
  }
  .glow{
    position:absolute; top:-220px; right:-220px; width:700px; height:700px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,106,26,.16), transparent 70%);
  }
  .content{
    position:relative; height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:0 90px;
  }
  .brand{display:flex; align-items:center; gap:22px; margin-bottom:36px;}
  .brand svg{width:76px; height:76px;}
  .brand span{font-family:'Plex Cond'; font-weight:700; font-size:52px; color:#E9ECF1; letter-spacing:.01em;}
  .brand .x{color:#FF6A1A;}
  h1{
    font-family:'Plex Cond'; font-weight:700; font-size:56px; line-height:1.08; color:#E9ECF1;
    max-width:920px; margin-bottom:26px; letter-spacing:-.01em;
  }
  p{font-family:'Plex Mono'; font-weight:500; font-size:22px; color:#97A2B4; letter-spacing:.02em;}
  p .dot{color:#FF6A1A;}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 120 120">
        <rect width="120" height="120" rx="22" fill="#0B0D12"/>
        <g fill="none" stroke="#7C93A8" stroke-width="7">
          <circle cx="60" cy="60" r="44"/>
          <ellipse cx="60" cy="60" rx="44" ry="16" transform="rotate(58 60 60)"/>
          <ellipse cx="60" cy="60" rx="44" ry="16" transform="rotate(122 60 60)"/>
        </g>
        <circle cx="60" cy="60" r="16" fill="#FF6A1A"/>
      </svg>
      <span>FUSION<span class="x">X</span></span>
    </div>
    <h1>Software that keeps your business moving.</h1>
    <p>BUILD <span class="dot">·</span> IMPROVE <span class="dot">·</span> MODERNIZE <span class="dot">·</span> MIGRATE <span class="dot">·</span> MAINTAIN</p>
  </div>
</body>
</html>
