<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{subject}}</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f4f6f8;color:#17212b;font-family:Arial,Helvetica,sans-serif">
    <main style="max-width:640px;margin:0 auto;padding:32px;background:#fff;border:1px solid #e2e7eb;border-radius:12px">
      <p style="margin:0 0 8px;color:#526477;font-size:12px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase">FusionX · Website enquiry</p>
      <h1 style="margin:0 0 24px;font-size:24px;line-height:1.3">{{subject}}</h1>
      <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.6">
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Name</td><td style="padding:7px 0;font-weight:bold">{{name}}</td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Email</td><td style="padding:7px 0"><a href="mailto:{{email}}" style="color:#176b87">{{email}}</a></td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Phone</td><td style="padding:7px 0">{{phone}}</td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Company</td><td style="padding:7px 0">{{company}}</td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Situation</td><td style="padding:7px 0">{{situation}}</td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Stage</td><td style="padding:7px 0">{{stage}}</td></tr>
        <tr><td style="padding:7px 12px 7px 0;color:#607080">Preferred call time</td><td style="padding:7px 0">{{preferredTime}}</td></tr>
      </table>
      <hr style="margin:24px 0;border:0;border-top:1px solid #e2e7eb">
      <h2 style="margin:0 0 8px;font-size:16px">Message</h2>
      <p style="margin:0;white-space:pre-wrap;font-size:15px;line-height:1.7">{{message}}</p>
      <p style="margin:28px 0 0;color:#73808c;font-size:12px">Sent from the FusionX contact form.</p>
    </main>
  </body>
</html>
